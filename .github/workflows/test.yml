name: CI/CD Pipeline

on:
  push:
    branches: [ main, dev, ruiferna ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    continue-on-error: false

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        path: cub3d
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y xorg libxext-dev zlib1g-dev libbsd-dev

    - name: Setup MLX for Linux
      working-directory: cub3d
      run: |
        git clone https://github.com/42Paris/minilibx-linux.git minilibx

    - name: Ensure Libft exists
      working-directory: cub3d
      run: |
        if [ ! -d "libs/libft" ] || [ ! -f "libs/libft/Makefile" ]; then
          echo "Libft not found or empty, cloning directly..."
          rm -rf libs/libft
          git clone https://github.com/ruiribeiro04/42-libft.git libs/libft
        fi

    - name: Build Libft
      working-directory: cub3d
      run: |
        make -C libs/libft

    - name: Build MiniLibX
      working-directory: cub3d
      run: |
        make -C minilibx

    - name: Build project
      working-directory: cub3d
      run: |
        make

    - name: Run parser tests
      id: parser_tests
      working-directory: cub3d
      run: |
        echo "test_output<<EOF" >> $GITHUB_OUTPUT
        make test_parser 2>&1 | tee -a $GITHUB_OUTPUT
        EXIT_CODE=${PIPESTATUS[0]}
        echo "EOF" >> $GITHUB_OUTPUT
        echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT

    - name: Run exhaustive parser tests
      id: exhaustive_tests
      working-directory: cub3d
      run: |
        echo "test_output<<EOF" >> $GITHUB_OUTPUT
        make test_parser_exhaustive 2>&1 | tee -a $GITHUB_OUTPUT
        EXIT_CODE=${PIPESTATUS[0]}
        echo "EOF" >> $GITHUB_OUTPUT
        echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT

    - name: Run integration tests
      id: integration_tests
      working-directory: cub3d
      continue-on-error: true
      run: |
        echo "test_output<<EOF" >> $GITHUB_OUTPUT
        make test_integration 2>&1 | tee -a $GITHUB_OUTPUT
        EXIT_CODE=${PIPESTATUS[0]}
        echo "EOF" >> $GITHUB_OUTPUT
        echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT

    - name: Show test results summary
      if: always()
      run: |
        echo "## Test Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Parser Tests" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        echo "${{ steps.parser_tests.outputs.test_output }}" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Exhaustive Parser Tests" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        echo "${{ steps.exhaustive_tests.outputs.test_output }}" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Integration Tests" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        echo "${{ steps.integration_tests.outputs.test_output }}" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: cub3d/test_*

    - name: Determine overall test status
      id: status
      if: always()
      run: |
        if [ "${{ steps.parser_tests.outputs.exit_code }}" != "0" ] || \
           [ "${{ steps.exhaustive_tests.outputs.exit_code }}" != "0" ] || \
           [ "${{ steps.integration_tests.outputs.exit_code }}" != "0" ]; then
          echo "overall_status=failed" >> $GITHUB_OUTPUT
          echo "::error::Tests failed - check the test output above"
          exit 1
        else
          echo "overall_status=passed" >> $GITHUB_OUTPUT
        fi

    - name: Discord Notification
      if: always()
      env:
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_TITLE: ${{ github.event.pull_request.title }}
        COMMIT_SHA: ${{ github.sha }}
        REPO: ${{ github.repository }}
      run: |
        if [ -n "$DISCORD_WEBHOOK_URL" ]; then
          if [ "${{ job.status }}" != "success" ]; then
            COLOR="15158332"
            STATUS="❌ Pipeline FAILED"
            # Extract failures for Discord message
            FAILURES=""
            if [ "${{ steps.parser_tests.outputs.exit_code }}" != "0" ] && [ "${{ steps.parser_tests.outputs.exit_code }}" != "" ]; then
              FAILURES="${FAILURES}\n• Parser Tests Failed"
            fi
            if [ "${{ steps.exhaustive_tests.outputs.exit_code }}" != "0" ] && [ "${{ steps.exhaustive_tests.outputs.exit_code }}" != "" ]; then
              FAILURES="${FAILURES}\n• Exhaustive Parser Tests Failed"
            fi
            if [ "${{ steps.integration_tests.outputs.exit_code }}" != "0" ] && [ "${{ steps.integration_tests.outputs.exit_code }}" != "" ]; then
              FAILURES="${FAILURES}\n• Integration Tests Failed"
            fi
            if [ -z "$FAILURES" ]; then
              FAILURES="Build phase or setup failed before tests."
            fi
          else
            COLOR="3066993"
            STATUS="✅ Tests PASSED"
            FAILURES="All tests passed successfully!"
          fi
          
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            TITLE="PR #$PR_NUMBER: $PR_TITLE"
            URL="${{ github.event.pull_request.html_url }}"
          else
            TITLE="Commit: ${{ github.sha }}"
            URL="https://github.com/$REPO/commit/${{ github.sha }}"
          fi
          
          ESCAPED_STATUS=$(printf '%s' "$STATUS" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read())[1:-1])')
          ESCAPED_FAILURES=$(printf '%s' "$FAILURES" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read())[1:-1])')
          ESCAPED_TITLE=$(printf '%s' "$TITLE" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read())[1:-1])')
          ESCAPED_REPO=$(printf '%s' "$REPO" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read())[1:-1])')
          
          PAYLOAD="{\"embeds\":[{\"title\":\"$ESCAPED_TITLE\",\"url\":\"$URL\",\"color\":$COLOR,\"fields\":[{\"name\":\"Repository\",\"value\":\"$ESCAPED_REPO\",\"inline\":true},{\"name\":\"Status\",\"value\":\"$ESCAPED_STATUS\",\"inline\":false},{\"name\":\"Failures\",\"value\":\"$ESCAPED_FAILURES\",\"inline\":false}],\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}]}"
          
          curl -s -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            --max-time 10
        fi